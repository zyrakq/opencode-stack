services:
  opencode:
    environment:
      OPENCODE_CORS_ORIGIN: https://${VIRTUAL_HOST}
      VIRTUAL_PORT: ${OPENCODE_SERVE_PORT:-4096}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PROTO: ${VIRTUAL_PROTO:-http}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - step-ca-network

networks:
  step-ca-network:
    name: step-ca-network
    external: true
