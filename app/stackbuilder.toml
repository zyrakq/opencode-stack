[paths]
environments_path = "./environments"

[build]
skip_base_generation = true
copy_additional_files = true
env_file_patterns = [".env"]
yaml_merger = "rust"
extensions = ["repo-sync", "repo-local"]

[build.combos]
forwarding-repo-sync = ["repo-sync"]
forwarding-repo-local = ["repo-local"]
letsencrypt-repo-sync = ["repo-sync"]
letsencrypt-repo-local = ["repo-local"]
step-ca-repo-sync = ["repo-sync"]
step-ca-repo-local = ["repo-local"]

[build.environments]
available = ["forwarding", "letsencrypt", "step-ca"]

[build.environments.forwarding]
extensions = []
combos = ["forwarding-repo-sync", "forwarding-repo-local"]

[build.environments.letsencrypt]
extensions = []
combos = ["letsencrypt-repo-sync", "letsencrypt-repo-local"]

[build.environments.step-ca]
extensions = []
combos = ["step-ca-repo-sync", "step-ca-repo-local"]

# Repo extensions (/projects): repo-sync is the DEFAULT; repo-local is the alternative.
# Mutually exclusive (both own /projects) - never list both. To switch, replace
# "repo-sync" with "repo-local" in the combo.
