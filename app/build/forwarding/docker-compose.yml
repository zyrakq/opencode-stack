x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  opencode:
    container_name: opencode
    image: ${IMAGE:-ghcr.io/anomalyco/opencode:2.2.5}
    build:
      context: .
      dockerfile_inline: |
        FROM ${IMAGE:-ghcr.io/anomalyco/opencode:2.2.5}
        ENV XDG_DATA_HOME=/data \
            XDG_STATE_HOME=/data/state \
            XDG_CACHE_HOME=/data/cache \
            OPENCODE_CONFIG_DIR=/data/config
        RUN rm -rf /opt/plugins && mkdir -p /data/opencode /data/state /data/cache /data/config /projects
        COPY entrypoint.sh /entrypoint.sh
        COPY plugins /opt/plugins
        RUN chmod +x /entrypoint.sh /opt/plugins/*.sh
        ENTRYPOINT ["/entrypoint.sh"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?}
      OPENCODE_SERVE_HOSTNAME: ${OPENCODE_SERVE_HOSTNAME:-0.0.0.0}
      OPENCODE_SERVE_PORT: ${OPENCODE_SERVE_PORT:-4096}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PLUGINS: ${PLUGINS:-}
    volumes:
      - opencode-stack-data:/data
      - opencode-stack-projects:/projects
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Authorization: Basic $$(echo -n opencode:$${OPENCODE_SERVER_PASSWORD} | base64)\" \"http://127.0.0.1:$${OPENCODE_SERVE_PORT:-4096}/openapi.json\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - opencode-stack-network
    ports:
      - "${OPENCODE_PUBLISH_PORT:-4096}:${OPENCODE_SERVE_PORT:-4096}"
    depends_on:
      opencode-stack-repo-sync:
        condition: service_started
  opencode-stack-repo-sync:
    image: ${REPO_SYNC_IMAGE:-alpine/git:latest}
    container_name: opencode-stack-repo-sync
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        URL="$${REPO_SYNC_URL}"
        BRANCH="$${REPO_SYNC_BRANCH:-main}"
        NAME="$${REPO_SYNC_DIR_NAME:-}"
        [ -n "$$NAME" ] || NAME="$$(basename "$${URL%.git}")"
        DEST="/projects/$$NAME"
        if [ -n "$${REPO_SYNC_TOKEN:-}" ]; then
          export GIT_ASKPASS=/tmp/askpass.sh
          printf '#!/bin/sh\necho "$$REPO_SYNC_TOKEN"\n' > /tmp/askpass.sh
          chmod 700 /tmp/askpass.sh
          export GIT_USERNAME="$${REPO_SYNC_USER:-x-access-token}"
          git config --global credential.username "$$GIT_USERNAME"
        fi
        if [ -n "$${REPO_SYNC_SSH_KEY:-}" ]; then
          printf '%s\n' "$$REPO_SYNC_SSH_KEY" > /tmp/id_sync
          chmod 600 /tmp/id_sync
          export GIT_SSH_COMMAND="ssh -i /tmp/id_sync -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts"
        fi
        git config --global --add safe.directory '*'
        while true; do
          if [ -d "$$DEST/.git" ]; then
            git -C "$$DEST" fetch --prune origin "$$BRANCH" && git -C "$$DEST" merge --ff-only "origin/$$BRANCH" \
              || echo "repo-sync: pull failed (local changes?), will retry"
          else
            git clone --branch "$$BRANCH" "$$URL" "$$DEST" || echo "repo-sync: clone failed, will retry"
          fi
          sleep "$${REPO_SYNC_INTERVAL:-300}"
        done
    environment:
      - REPO_SYNC_URL=${REPO_SYNC_URL:?}
      - REPO_SYNC_BRANCH=${REPO_SYNC_BRANCH:-main}
      - REPO_SYNC_DIR_NAME=${REPO_SYNC_DIR_NAME:-}
      - REPO_SYNC_TOKEN=${REPO_SYNC_TOKEN:-}
      - REPO_SYNC_USER=${REPO_SYNC_USER:-x-access-token}
      - REPO_SYNC_SSH_KEY=${REPO_SYNC_SSH_KEY:-}
      - REPO_SYNC_INTERVAL=${REPO_SYNC_INTERVAL:-300}
      - TZ=${TZ:-UTC}
    volumes:
      - opencode-stack-projects:/projects
    networks:
      - opencode-stack-network
volumes:
  opencode-stack-data:
    name: opencode-stack-data
  opencode-stack-projects:
    name: opencode-stack-projects
networks:
  opencode-stack-network:
    name: opencode-stack-network
