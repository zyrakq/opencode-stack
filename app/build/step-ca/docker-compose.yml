x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
# step-ca-trust extension (step-ca environment only): mounts the external
# step-ca-data volume (certs/ subpath, read-only) and installs the step-ca
# root CA into the container trust store before exec'ing the baked
# /entrypoint.sh (base serve-flag wrapper; the plugins extension replaces
# that same path, so chaining works in every combo). The upstream image runs
# as root, so no privilege drop is needed — trust setup runs directly and
# `exec` keeps PID1 as the app. Bun (opencode's runtime) additionally gets
# NODE_EXTRA_CA_CERTS pointing at the source CA. Inert without the
# step-ca-data volume: the entrypoint fails fast after STEP_CA_WAIT_TIMEOUT.
services:
  opencode-stack-app:
    container_name: opencode-stack-app
    image: ${IMAGE:-ghcr.io/anomalyco/opencode:2.2.5}
    build:
      context: .
      dockerfile_inline: |
        FROM ${IMAGE:-ghcr.io/anomalyco/opencode:2.2.5}
        # Pin all XDG roots + the config dir onto the persistent data volume
        # (same as the base layer).
        ENV XDG_DATA_HOME=/data \
            XDG_STATE_HOME=/data/state \
            XDG_CACHE_HOME=/data/cache \
            OPENCODE_CONFIG_DIR=/data/config
        # Plugin toggles, baked at build time (empty = disabled).
        ENV PLUGINS_MICODE=${PLUGINS_MICODE:-} \
            PLUGINS_DCP=${PLUGINS_DCP:-} \
            PLUGINS_RTK=${PLUGINS_RTK:-} \
            PLUGINS_HEADROOM=${PLUGINS_HEADROOM:-}
        RUN mkdir -p /data/opencode /data/state /data/cache /data/config /projects
        COPY entrypoint.sh /entrypoint.sh
        # entrypoint.sh is always present in the build dir (sb copies it from
        # the base component); plugins*/ matches the optional sibling folder —
        # absence is tolerated because the COPY has another matching source.
        COPY entrypoint.sh plugins* /opt/plugins-build/
        RUN chmod +x /entrypoint.sh \
          && if [ -d /opt/plugins-build/plugins ]; then \
               for s in /opt/plugins-build/plugins/install-*.sh; do \
                 [ -f "$$s" ] || continue; \
                 sh "$$s"; \
               done; \
             fi \
          && rm -rf /opt/plugins-build
        ENTRYPOINT ["/entrypoint.sh"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Required: basic-auth password (user "opencode") for the web UI + API.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?}
      # Serve flags consumed by the baked entrypoint wrapper (upstream serve
      # accepts only --hostname/--port/--cors flags, no env equivalents).
      OPENCODE_SERVE_HOSTNAME: ${OPENCODE_SERVE_HOSTNAME:-0.0.0.0}
      OPENCODE_SERVE_PORT: ${OPENCODE_SERVE_PORT:-4096}
      # Provider model keys (optional passthrough; the gate seeds auth.json
      # into the data volume instead). CORS origin is environment-dependent
      # and is declared ONLY in the environment overlays, never here.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Public origin allowed by the serve --cors flag (environment-dependent,
      # declared only in overlays). Space-separated list for multiple origins.
      OPENCODE_CORS_ORIGIN: https://${VIRTUAL_HOST}
      VIRTUAL_PORT: ${OPENCODE_SERVE_PORT:-4096}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PROTO: ${VIRTUAL_PROTO:-http}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      STEP_CA_ROOT_CA_SRC: ${STEP_CA_ROOT_CA_SRC:-/step-ca-root/root_ca.crt}
      STEP_CA_ROOT_CA_FILE: ${STEP_CA_ROOT_CA_FILE:-/usr/local/share/ca-certificates/step-ca-root.crt}
      STEP_CA_WAIT_TIMEOUT: ${STEP_CA_WAIT_TIMEOUT:-60}
    volumes:
      - opencode-stack-data:/data
      - opencode-stack-projects:/projects
      - type: volume
        source: step-ca-data
        target: /step-ca-root
        read_only: true
        volume:
          subpath: certs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Authorization: Basic $$(echo -n opencode:$${OPENCODE_SERVER_PASSWORD} | base64)\" \"http://127.0.0.1:$${OPENCODE_SERVE_PORT:-4096}/openapi.json\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - opencode-stack-network
      - step-ca-network
    depends_on:
      opencode-stack-repo-sync:
        condition: service_started
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        SRC="$${STEP_CA_ROOT_CA_SRC:-/step-ca-root/root_ca.crt}"
        DST="$${STEP_CA_ROOT_CA_FILE:-/usr/local/share/ca-certificates/step-ca-root.crt}"
        WAIT="$${STEP_CA_WAIT_TIMEOUT:-60}"
        i=0
        while [ ! -s "$$SRC" ]; do
          i=$$((i+1))
          [ "$$i" -gt "$$WAIT" ] && { echo "step-ca-trust: $$SRC not found after $${WAIT}s" >&2; exit 1; }
          sleep 1
        done
        mkdir -p "$$(dirname "$$DST")"
        cp "$$SRC" "$$DST"
        chmod 644 "$$DST"
        update-ca-certificates
        export NODE_EXTRA_CA_CERTS="$$SRC"
        exec /entrypoint.sh
  opencode-stack-repo-sync:
    image: ${REPO_SYNC_IMAGE:-alpine/git:latest}
    container_name: opencode-stack-repo-sync
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        URL="$${REPO_SYNC_URL}"
        BRANCH="$${REPO_SYNC_BRANCH:-main}"
        NAME="$${REPO_SYNC_DIR_NAME:-}"
        [ -n "$$NAME" ] || NAME="$$(basename "$${URL%.git}")"
        DEST="/projects/$$NAME"
        if [ -n "$${REPO_SYNC_TOKEN:-}" ]; then
          # token via https credential helper (not stored in the URL / .git/config)
          export GIT_ASKPASS=/tmp/askpass.sh
          printf '#!/bin/sh\necho "$$REPO_SYNC_TOKEN"\n' > /tmp/askpass.sh
          chmod 700 /tmp/askpass.sh
          export GIT_USERNAME="$${REPO_SYNC_USER:-x-access-token}"
          git config --global credential.username "$$GIT_USERNAME"
        fi
        if [ -n "$${REPO_SYNC_SSH_KEY:-}" ]; then
          printf '%s\n' "$$REPO_SYNC_SSH_KEY" > /tmp/id_sync
          chmod 600 /tmp/id_sync
          export GIT_SSH_COMMAND="ssh -i /tmp/id_sync -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts"
        fi
        git config --global --add safe.directory '*'
        while true; do
          if [ -d "$$DEST/.git" ]; then
            git -C "$$DEST" fetch --prune origin "$$BRANCH" && git -C "$$DEST" merge --ff-only "origin/$$BRANCH" \
              || echo "repo-sync: pull failed (local changes?), will retry"
          else
            git clone --branch "$$BRANCH" "$$URL" "$$DEST" || echo "repo-sync: clone failed, will retry"
          fi
          sleep "$${REPO_SYNC_INTERVAL:-300}"
        done
    environment:
      - REPO_SYNC_URL=${REPO_SYNC_URL:?}
      - REPO_SYNC_BRANCH=${REPO_SYNC_BRANCH:-main}
      - REPO_SYNC_DIR_NAME=${REPO_SYNC_DIR_NAME:-}
      - REPO_SYNC_TOKEN=${REPO_SYNC_TOKEN:-}
      - REPO_SYNC_USER=${REPO_SYNC_USER:-x-access-token}
      - REPO_SYNC_SSH_KEY=${REPO_SYNC_SSH_KEY:-}
      - REPO_SYNC_INTERVAL=${REPO_SYNC_INTERVAL:-300}
      - TZ=${TZ:-UTC}
    volumes:
      - opencode-stack-projects:/projects
    networks:
      - opencode-stack-network
volumes:
  opencode-stack-data:
    name: opencode-stack-data
  opencode-stack-projects:
    name: opencode-stack-projects
  step-ca-data:
    external: true
networks:
  opencode-stack-network:
    name: opencode-stack-network
  step-ca-network:
    name: step-ca-network
    external: true
